# AgentGate default policy — ordered, first-match-wins.
# Generated by `agentgate init`. Edit freely; see the README for the full DSL.

default: ask

rules:
  # Ask before every dependency install so you see exactly what gets pulled.
  - match:
      action: exec
      target_glob: "*install*"
    decision: ask

  # fs_write is CHECK/DRY-RUN-ONLY in this version: the policy engine and
  # `agentgate check --action fs_write` resolve these rules, but AgentGate does
  # NOT yet intercept an agent's actual writes at runtime (runtime write
  # interposition — ptrace/eBPF/LD_PRELOAD — is roadmapped). So we ship only the
  # documenting allow-scope rule and deliberately DO NOT ship a blanket
  # `deny fs_write` catch-all here: a default that pretends to confine writes it
  # cannot actually stop at runtime is a false security promise. Use
  # `agentgate check` to validate write rules; do not rely on them being enforced
  # on a live run yet.
  - match:
      action: fs_write
      target_glob: "$PWD/**"
    decision: allow
    scope: "$PWD"

  # Allow the common public registries; gate every other host.
  - match:
      action: net_egress
      target_glob: "registry.npmjs.org"
    decision: allow
  - match:
      action: net_egress
      target_glob: "pypi.org"
    decision: allow
  - match:
      action: net_egress
      target_glob: "files.pythonhosted.org"
    decision: allow
  - match:
      action: net_egress
      target_glob: "github.com"
    decision: allow
  - match:
      action: net_egress
      target_glob: "proxy.golang.org"
    decision: allow
  - match:
      action: net_egress
    decision: deny
