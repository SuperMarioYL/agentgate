version: 2

project_name: agentgate

before:
  hooks:
    - go mod tidy

builds:
  - id: agentgate
    main: ./cmd/agentgate
    binary: agentgate
    env:
      - CGO_ENABLED=0
    # Linux + macOS only — matches the README platform badge. Windows binaries
    # used to ship here, but the runtime is POSIX-only (#!/bin/sh shim scripts;
    # syscall.Exec returns EWINDOWS unconditionally on windows), so those
    # artifacts installed but could never gate anything.
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: SuperMarioYL
    name: agentgate
  draft: false

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
