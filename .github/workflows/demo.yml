name: demo

on:
  workflow_dispatch: {}
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  vhs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build binary for the demo
        run: go build -o /usr/local/bin/agentgate ./cmd/agentgate
      - name: Install vhs + deps (ffmpeg, ttyd, vhs)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo curl -fsSL -o /usr/local/bin/ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
          sudo chmod +x /usr/local/bin/ttyd
          go install github.com/charmbracelet/vhs@latest
      - name: Render demo.gif
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          vhs docs/demo.tape
      - name: Commit rendered gif
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add assets/demo.gif
          git commit -m "chore: render demo gif" || { echo "no change"; exit 0; }
          # On a tag push HEAD is the detached tag commit; pushing it straight to
          # main is rejected non-fast-forward whenever a commit landed on main
          # during the multi-minute render (this failed at the v0.12.0 tag, gh
          # run 33591370724). Rebase the single gif commit onto current main
          # first — never force-push. If the replay is empty (gif unchanged),
          # HEAD == origin/main and the push is an up-to-date success.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
